        }
 
        /* #row1, #row2, #row3, #row4 {
            display: flex;
        } */
        
        /*  width of main: 800px
            num of images = 10
        */
        .img-con {
            color: black;
            background-color: blueviolet;
            margin-left: auto;
            margin-right: auto;
            overflow: hidden;
            position: relative;
        }
        .img-con > img {
            height: 100%;
            width: auto;
        }
        .img-con > div {
            position: absolute;
            background-color: #000;
            background-color: rgba(0,0,0,0.6);
            color: #FFF;

            top: 0px;
            bottom: 0px;
            left: 0px;
            right: 0px;

            text-align: center;
            padding-top: 100px;
            display: none;
        }
        .img-con:hover > div {
            display: block;
        }
        /*for row1, pic1 & pic3
            280 * 2 = 560px + 40px = 600px (20 margin total on each photo)
            therefore, 600px used, 200px left for last photo, but 
            since it needs 20margin space, 180px left
        */
        #pic1, #pic3 {
            width: 280px;
            height: 200px;
            margin: 10px;
        }
        #pic2 {
            width: 180px;

        #pic4, #pic10 {

            height: 200px;
            margin: 10px;
        }
        #pic8 {
            width: 310px;
            height: 200px;
            margin: 10px;
        }
