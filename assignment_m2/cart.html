<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="shared.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption Cart</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    .navbar{
        padding-bottom: 200px;
    }
    .navbar-nav .nav-link.active {
        font-weight: bold;
        color: yellow;
    }
    </style>
</head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
          <a class="navbar-brand" href="login.html"><strong>Pawleeze</strong></a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="shop.html"><strong>Shop</strong></a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" href="cart.html"><strong>Cart</strong></a>
              </li>
              <!-- <li class="nav-item">
                <a class="nav-link" href="about.html"><strong>About</strong></a>
              </li> -->
            </ul> 
          </div>
        </div>
      </nav> <!--.navbar-->
    <template id="cart-item-template">
        <li>
            Name: <span class="pet-name"></span>, 
            Details: <span class="pet-details"></span>
            <button class="btn btn-danger btn-sm remove-btn">Remove</button>
            <button class="btn btn-primary btn-sm edit-btn">Edit</button>
        </li>
    </template>
    

    <div class="container">
        <div class="row mt-4">
            <h2 class="col-12">Cart</h2>
            <div class="col-12 mt-4">
                <ul id="cart-items">

                </ul>
                <button id="checkout" type="submit" class="btn btn-primary">Adopt Now!</button>
            </div> <!-- .col -->
        </div> <!-- .row -->
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

    <script>
    function displayCart() {
        var cartItems = JSON.parse(localStorage.getItem('cartItems')) || [];
        var cartList = document.getElementById('cart-items');

        // Clear previous content
        cartList.innerHTML = '';

        // Display each cart item
        cartItems.forEach(function(item, index) {
        // Clone the template content
        var template = document.getElementById('cart-item-template');
        var clone = template.content.cloneNode(true);

        // Update the cloned item with pet name
        var petNameElement = clone.querySelector('.pet-name');
        if (petNameElement) {
            petNameElement.textContent = item.name;
        }
        
        var petDetailsElement = clone.querySelector('.pet-details');
        if (petDetailsElement) {
            petDetailsElement.textContent = item.details;
        }

        // Add event listener to remove button
        clone.querySelector('.remove-btn').addEventListener('click', function(event) {
            // Get the index of the item to be removed
            var removeIndex = cartItems.findIndex(function(cartItem) {
                return cartItem.name === item.name && cartItem.details === item.details;
            });

            // Remove the item from the cartItems array
            cartItems.splice(removeIndex, 1);

            // Update local storage with the modified cart items
            updateLocalStorage(cartItems);

            // Get the parent <li> element of the clicked button and remove it
            var listItem = event.target.closest('li');
            if (listItem) {
                listItem.remove();
            }
        });

        // Add event listener to edit button
        clone.querySelector('.edit-btn').addEventListener('click', function() {
            var newName = prompt('Enter new name for the pet:');
            if (newName) {
                // Update cart item name
                item.name = newName;
                // Update displayed name
                if (petNameElement) {
                    petNameElement.textContent = newName;
                }
                // Update local storage with the modified cart items
                updateLocalStorage(cartItems);
            }
        });

        // Append cloned item to the cart list
        cartList.appendChild(clone);
    });
}
    function updateLocalStorage(cartItems) {
        localStorage.setItem('cartItems', JSON.stringify(cartItems));
    }
    // Call displayCart function when the page loads
    window.onload = displayCart; 

    document.getElementById('checkout').addEventListener('click', function(event) {
        alert('You have checked out. Thank you!')
        window.location.href = 'login.html'
    })
</script>
    
    <div id="footer" class="container-fluid">
        <div class="row">
            <div class="col-12 text-center">
                dearKDV &copy; 2024
                <p>10% of proceeds go to a dog org</p>
            </div>
        </div>
    </div> <!--#footer-->
</body>
</html>
